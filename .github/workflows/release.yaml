name: Release to PyPI
on:
  push:
    tags: ["*"]
permissions:
  contents: read
env:
  dists-artifact-name: python-package-distributions
jobs:
  build:
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@1b7d58c3e744b505215e1cb11697a80737b0e94d # v1.0.1
    permissions:
      contents: read
  previous:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.previous.outputs.previous }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@1b7d58c3e744b505215e1cb11697a80737b0e94d # v1.0.1
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: Find previous release
        id: previous
        uses: tox-dev/github-workflows/select-previous-tag@1b7d58c3e744b505215e1cb11697a80737b0e94d # v1.0.1
        with:
          tag: ${{ github.ref_name }}
  metadata:
    needs: previous
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: Fetch contributor metadata
        if: needs.previous.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PREVIOUS: ${{ needs.previous.outputs.tag }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" -f previous_tag_name="$PREVIOUS" \
            --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - name: Fetch first-release metadata
        if: needs.previous.outputs.tag == ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body >"$RUNNER_TEMP/generated-notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/generated-notes.md
          if-no-files-found: error
  notes:
    needs: metadata
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@1b7d58c3e744b505215e1cb11697a80737b0e94d # v1.0.1
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: contributor-metadata
          path: ${{ runner.temp }}/contributor-metadata
      - uses: tox-dev/github-workflows/render-release-notes@1b7d58c3e744b505215e1cb11697a80737b0e94d # v1.0.1
        with:
          tag: ${{ github.ref_name }}
          changelog: CHANGELOG.md
          artifact-url: https://pypi.org/project/pre-commit-uv/${{ github.ref_name }}/
          generated-notes: ${{ runner.temp }}/contributor-metadata/generated-notes.md
          output: ${{ runner.temp }}/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  stage-github-release:
    needs: [build, notes]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes
      - uses: tox-dev/github-workflows/publish-github-release@1b7d58c3e744b505215e1cb11697a80737b0e94d # v1.0.1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          mode: stage
          notes-file: ${{ runner.temp }}/release-notes/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
  release:
    needs:
      - build
      - stage-github-release
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/pre-commit-uv/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true
  verify-pypi:
    needs:
      - build
      - release
      - stage-github-release
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/
      - uses: tox-dev/github-workflows/reconcile-pypi-artifacts@1b7d58c3e744b505215e1cb11697a80737b0e94d # v1.0.1
        with:
          project: pre-commit-uv
          version: ${{ github.ref_name }}
          dist: dist
  github-release:
    needs: [verify-pypi, notes, stage-github-release]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes
      - uses: tox-dev/github-workflows/publish-github-release@1b7d58c3e744b505215e1cb11697a80737b0e94d # v1.0.1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          mode: publish
          notes-file: ${{ runner.temp }}/release-notes/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
