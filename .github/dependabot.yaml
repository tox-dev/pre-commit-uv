version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - dependencies
      - github_actions
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "pre-commit"
    directory: "/"
    allow:
      - dependency-name: mdformat-gfm
    labels:
      - dependencies
      - skip news
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
